<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minigame</title>
  <audio id="background-music"></audio>
  <script>
    const playlist = [
      "/Music/C418 - Aria Math.mp3",
      "/Music/C418 - Dry Hands.mp3",
      "/Music/C418 - Living Mice.mp3",
      "/Music/C418 - Subwoofer Lullaby.mp3",
      "/Music/C418 - Wet Hands.mp3"
    ];
    let currentTrack = Math.floor(Math.random() * playlist.length);

    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("background-music");
      if (audio) {
        audio.src = playlist[currentTrack];
        audio.addEventListener("ended", () => {
          currentTrack = (currentTrack + 1) % playlist.length;
          audio.src = playlist[currentTrack];
          audio.play().catch(e => console.error("Audio play error: ", e));
        });
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
